<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Text Scanner</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; shadow: 0 0 10px rgba(0,0,0,0.1); }
        #video { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        #canvas { display: none; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; background: #e9e9e9; min-height: 50px; text-align: left; white-space: pre-wrap; border-radius: 5px; }
        .loading { color: orange; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Text Scanner (OCR)</h2>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <br>
    <button onclick="scanText()">SCAN (စာသားဖတ်ရန်)</button>

    <div id="status"></div>
    <div id="result">ဖတ်ထားသော စာသားများ ဤနေရာတွင် ပေါ်လာမည်...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const statusDiv = document.getElementById('status');

    // ၁။ ဖုန်းကင်မရာကို ဖွင့်ခြင်း
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
        } catch (err) {
            alert("ကင်မရာဖွင့်လို့မရပါ: " + err);
        }
    }

    // ၂။ ပုံထဲက စာသားကို ဖတ်ခြင်း (OCR Process)
    async function scanText() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        statusDiv.innerHTML = '<p class="loading">စာသားများကို ဖတ်နေသည်... ခဏစောင့်ပါ...</p>';
        resultDiv.innerText = "";

        // Tesseract.js အသုံးပြု၍ စာသားထုတ်ယူခြင်း
        Tesseract.recognize(
            canvas.toDataURL('image/png'),
            'eng', // အင်္ဂလိပ်စာအတွက် (မြန်မာစာအတွက် 'mya' ပြောင်းနိုင်သည်)
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            statusDiv.innerHTML = '<p style="color:green;">ဖတ်လို့ပြီးပါပြီ။</p>';
            resultDiv.innerText = text;
        }).catch(err => {
            statusDiv.innerHTML = '<p style="color:red;">အမှားအယွင်းရှိနေပါသည်။</p>';
            console.error(err);
        });
    }

    // App စတင်တာနဲ့ ကင်မရာဖွင့်မည်
    startCamera();
</script>

</body>
</html>
