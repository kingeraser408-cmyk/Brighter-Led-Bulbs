<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Best No.1 SMM Panel - မြန်မာ့အကောင်းဆုံး ဝန်ဆောင်မှု</title>
    
    <link rel="stylesheet" type="text/css" href="https://storage.perfectcdn.com/ej6fkp/em3e8eqpfzocz63j.css">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #ffcc00;
            --dark-bg: #0f172a;
        }
        body { font-family: 'Pyidaungsu', sans-serif; background-color: var(--dark-bg); color: white; }
        
        /* အပေါ်ဆုံးက Logo နဲ့ Menu အလှဆင်ခြင်း */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1e293b; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--primary-gold); text-transform: uppercase; letter-spacing: 1px; }

        /* Order Counter Style (လူအထင်ကြီးစေရန်) */
        .stats-container {
            background: linear-gradient(90deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            border: 1px solid var(--primary-gold);
        }
        .order-number { font-size: 35px; color: var(--primary-gold); font-weight: 800; text-shadow: 0 0 10px rgba(255,204,0,0.5); }
        .stats-label { color: #94a3b8; font-size: 14px; text-transform: uppercase; }

        /* Floating Action Button (Customer တောင်းဆိုချက် သိစေရန်) */
        .support-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25d366; /* WhatsApp color */
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 999;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body id="guest">

<div class="outside">
    <header>
        <div class="container">
            <div class="main-header">
                <div class="mh-wrapper">
                    <div class="mh-logo">
                        <a href="/" class="logo-text">BEST NO.1 SMM</a>
                    </div>
                    <div class="mh-menu-wrapper">
                        <div class="mh-menu">
                            <ul class="menu">
                                <li><a href="/services" style="color:white">ဝန်ဆောင်မှုများ</a></li>
                                <li><a href="/api" style="color:white">API ချိတ်ဆက်ရန်</a></li>
                            </ul>
                        </div>
                        <div class="mh-buttons">
                            <a href="/signup" class="btn btn-primary" style="background: var(--primary-gold); border:none; color:black; font-weight:bold;">အကောင့်သစ်ဖွင့်မည်</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container" style="margin-top: 50px;">
            <div class="text-center">
                <h1 style="font-size: 40px; color: var(--primary-gold);">Best No.1 SMM Panel</h1>
                <p style="color: #cbd5e1;">မြန်မာနိုင်ငံ၏ ယုံကြည်ရဆုံးနှင့် အမြန်ဆုံး ဆိုရှယ်မီဒီယာ ဝန်ဆောင်မှု</p>
            </div>

            <div class="stats-container">
                <div class="row">
                    <div class="col-md-6">
                        <div class="order-number" id="orderCount">1,245,780</div>
                        <div class="stats-label">စုစုပေါင်း အော်ဒါအရေအတွက်</div>
                    </div>
                    <div class="col-md-6">
                        <div class="order-number" style="color: #25d366;">Active</div>
                        <div class="stats-label">စနစ်အခြေအနေ</div>
                    </div>
                </div>
            </div>

            <iframe src="https://v0-hi-seven-theta.vercel.app/support" width="100%" height="600" style="border:none; border-radius:15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" scrolling="no"></iframe>
        </div>
    </main>

    <a href="https://t.me/shweboost" target="_blank" class="support-fab">
        <i class="fab fa-telegram-plane" style="color: white;"></i>
    </a>

    <footer>
        <div class="footer-bottom">
            <div class="container text-center">
                <div class="copyright">Best No.1 SMM Panel © 2026 - All Rights Reserved.</div>
            </div>
        </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Order Number ကို အလိုအလျောက် တိုးပေးမည့် စနစ်
    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    // ၅ စက္ကန့်တစ်ခါ အော်ဒါအရေအတွက်ကို ၁ ခု သို့မဟုတ် ၂ ခု တိုးပြခြင်း
    let currentOrders = 1245780;
    setInterval(function() {
        let increase = Math.floor(Math.random() * 3) + 1; // 1 to 3 orders
        currentOrders += increase;
        document.getElementById("orderCount").innerHTML = currentOrders.toLocaleString();
    }, 5000);

    // ပထမဆုံး အစမှာ Animation လေးနဲ့ စပေးခြင်း
    const obj = document.getElementById("orderCount");
    animateValue(obj, 1200000, 1245780, 2000);
</script>

</html>
